# Local dev compose file for the BlueWeb audit ingest worker.
# See BLUEWEB_AUDIT_INGEST_SPEC.md §4.4.
#
# Production deploys should replace `build: .` + the local `image:` tag with
# a digest-pinned remote image:
#   image: registry.local/bluewave-worker@sha256:<digest>
#
# Env vars come from `.env` via `env_file:`. We deliberately do NOT use the
# `environment:` block with ${VAR} substitution — Compose interpolates `$`
# inside substituted values, which corrupts bcrypt hashes (they contain `$`).
# `env_file:` passes values to the container verbatim. The container itself
# validates required vars at startup (see bluewave/web.py::validate_env).

services:
  bluewave-worker:
    build: .
    image: bluewave-worker:dev
    container_name: bluewave-worker
    restart: unless-stopped

    env_file:
      - .env

    ports:
      - "8080:8080"

    volumes:
      - bluewave-state:/var/lib/bluewave-worker

    tmpfs:
      - /tmp/bluewave-dl:size=128m

    # Standalone-compose resource limits (spec §4.4).
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0

volumes:
  bluewave-state:
