# Local dev compose file for the BlueWeb audit ingest worker.
# See BLUEWEB_AUDIT_INGEST_SPEC.md §4.4.
#
# IMPORTANT: env values live in `worker.env`, NOT `.env`.
# Reason: Compose AUTO-LOADS any file literally named `.env` from the
# project root and performs variable interpolation on its values. bcrypt
# hashes contain `$` characters, which Compose treats as variable
# references, corrupting the hash before it ever reaches the container.
# Using a non-default filename + `format: raw` makes the load verbatim.
#
# Production deploys: replace `build: .` + `image:` with a digest-pinned
# remote image:
#   image: registry.local/bluewave-worker@sha256:<digest>

services:
  bluewave-worker:
    build: .
    image: bluewave-worker:dev
    container_name: bluewave-worker
    restart: unless-stopped

    env_file:
      - path: worker.env
        required: true
        format: raw

    ports:
      - "8080:8080"

    volumes:
      - bluewave-state:/var/lib/bluewave-worker

    tmpfs:
      - /tmp/bluewave-dl:size=128m

    # Standalone-compose resource limits (spec §4.4).
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0

volumes:
  bluewave-state:
