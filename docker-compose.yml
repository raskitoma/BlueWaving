# Local dev compose file for the BlueWeb audit ingest worker.
# See BLUEWEB_AUDIT_INGEST_SPEC.md §4.4.
#
# Production deploys should replace `build: .` + `image:` with a
# digest-pinned remote image:
#   image: registry.local/bluewave-worker@sha256:<digest>

services:
  bluewave-worker:
    build: .
    image: bluewave-worker:dev
    container_name: bluewave-worker
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      # Required per spec §4.5.
      CONFIG_ENC_KEYS:  "${CONFIG_ENC_KEYS:?set in .env; generate via python -m bluewave.keygen}"
      WEB_USER:         "${WEB_USER:?set in .env}"
      WEB_PASS_HASH:    "${WEB_PASS_HASH:?set in .env; generate via python -m bluewave.hashpw}"
      WEB_ALLOW_HTTP:   "${WEB_ALLOW_HTTP:?must be 1 (spec L13)}"

      # Optional, with defaults.
      TZ:                       "${TZ:-UTC}"
      LOG_LEVEL:                "${LOG_LEVEL:-INFO}"
      CATCH_UP_CAP_DAYS:        "${CATCH_UP_CAP_DAYS:-14}"
      BACKFILL_SAFETY_CAP_DAYS: "${BACKFILL_SAFETY_CAP_DAYS:-365}"

    volumes:
      - bluewave-state:/var/lib/bluewave-worker

    tmpfs:
      - /tmp/bluewave-dl:size=128m

    # Standalone-compose resource limits (spec §4.4).
    mem_limit: 1g
    mem_reservation: 256m
    cpus: 1.0

volumes:
  bluewave-state:
